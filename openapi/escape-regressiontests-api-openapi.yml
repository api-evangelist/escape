  /regression-tests/{regressionTestId}/history:
    get:
      tags:
      - RegressionTests
      summary: List the runs of a regression test
      operationId: listRegressionTestHistory
      description: List the runs of a regression test, most recent first. When the test does not exist (or belongs to another organization), the internal API returns an error that is forwarded as a 404 to avoid leaking its existence.
      parameters:
      - schema:
          type: string
          format: uuid
          description: The regression test ID
          example: 00000000-0000-0000-0000-000000000000
        required: true
        description: The regression test ID
        name: regressionTestId
        in: path
      - schema:
          type: string
          description: The cursor to start the pagination from. Returned by the previous page response. If not provided, the first page will be returned.
          example: 00000000-0000-0000-0000-000000000000
        required: false
        description: The cursor to start the pagination from. Returned by the previous page response. If not provided, the first page will be returned.
        name: cursor
        in: query
      - schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
          description: The number of items to return per page
          example: 50
        required: false
        description: The number of items to return per page
        name: size
        in: query
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  nextCursor:
                    type:
                    - string
                    - 'null'
                  totalCount:
                    type: integer
                    default: 100
                    example: 20
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                          description: The id of the regression test run
                        status:
                          type: string
                          enum:
                          - CANCELLED
                          - CLARIFICATION_GIVEN
                          - CLARIFICATION_REQUIRED
                          - ERROR
                          - NOT_STARTED
                          - RUNNING
                          - TEST_FAILED
                          - TEST_PASSED
                          description: The status of the run
                        clarificationQuestion:
                          type:
                          - string
                          - 'null'
                          description: The question the agent asked, when the run needs a clarification
                        clarificationAnswer:
                          type:
                          - string
                          - 'null'
                          description: The answer given to the clarification question
                        validationId:
                          type:
                          - string
                          - 'null'
                          description: The id of the validation (scan) that ran the test
                        createdAt:
                          type: string
                          description: When the run was created
                        updatedAt:
                          type: string
                          description: When the run was last updated
                      required:
                      - id
                      - status
                      - clarificationQuestion
                      - clarificationAnswer
                      - validationId
                      - createdAt
                      - updatedAt
                      title: RegressionTestRun
                      description: A single run of a regression test
                required:
                - nextCursor
                - data
        '400':
          description: Pagination error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    enum:
                    - Invalid cursor
                    - Branch filters page limit reached
                  details:
                    type: string
                required:
                - message
                - details
                title: PaginationError
                description: Returned when an invalid pagination cursor is supplied or when the branch filters page limit is reached
        '404':
          description: Not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    enum:
                    - Not found
                required:
                - message
                title: NotFound
                description: Returned when the requested resource does not exist
