openapi: 3.2.0
info:
  version: 3.0.0
  title: Escape Public Regression Tests API
  description: 'This API enables you to operate Escape programmatically.


    All requests must be authenticated with a valid API key, provided in the `X-ESCAPE-API-KEY` header.

    For example: `X-ESCAPE-API-KEY: YOUR_API_KEY`.


    You can find your API key in the Escape dashboard.'
servers:
- url: https://public.escape.tech/v3
security:
- apiKey: []
tags:
- name: RegressionTests
  description: 'Manage regression tests.


    Create regression tests from a source report, run them, and track their history. A regression test re-validates a finding against an updated codebase.'
paths:
  /regression-tests:
    get:
      tags:
      - RegressionTests
      summary: List regression tests
      operationId: listRegressionTests
      description: List the regression tests of the organization, most recent first.
      parameters:
      - schema:
          type: string
          description: The cursor to start the pagination from. Returned by the previous page response. If not provided, the first page will be returned.
          example: 00000000-0000-0000-0000-000000000000
        required: false
        description: The cursor to start the pagination from. Returned by the previous page response. If not provided, the first page will be returned.
        name: cursor
        in: query
      - schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
          description: The number of items to return per page
          example: 50
        required: false
        description: The number of items to return per page
        name: size
        in: query
      - schema:
          type: string
          description: Search term to filter regression tests by name
          example: checkout
        required: false
        description: Search term to filter regression tests by name
        name: search
        in: query
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  nextCursor:
                    type:
                    - string
                    - 'null'
                  totalCount:
                    type: integer
                    default: 100
                    example: 20
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                          description: The id of the regression test
                        name:
                          type: string
                          description: The name of the regression test
                        inputFilename:
                          type: string
                          description: The name of the uploaded source report file
                        inputFormat:
                          type: string
                          enum:
                          - MARKDOWN
                          - PDF
                          description: The format of the source report
                        status:
                          type: string
                          enum:
                          - CANCELLED
                          - CLARIFICATION_GIVEN
                          - CLARIFICATION_REQUIRED
                          - ERROR
                          - NOT_STARTED
                          - RUNNING
                          - TEST_FAILED
                          - TEST_PASSED
                          description: The status of the latest run of the regression test
                        createdAt:
                          type: string
                          description: When the regression test was created
                        updatedAt:
                          type: string
                          description: When the regression test was last updated
                      required:
                      - id
                      - name
                      - inputFilename
                      - inputFormat
                      - status
                      - createdAt
                      - updatedAt
                      title: RegressionTestSummary
                      description: Summarized information about a regression test
                required:
                - nextCursor
                - data
        '400':
          description: Pagination error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    enum:
                    - Invalid cursor
                    - Branch filters page limit reached
                  details:
                    type: string
                required:
                - message
                - details
                title: PaginationError
                description: Returned when an invalid pagination cursor is supplied or when the branch filters page limit is reached
    post:
      tags:
      - RegressionTests
      summary: Create a regression test
      operationId: createRegressionTest
      description: Create a regression test from a source report. Upload the report first with POST /v3/upload/signed-url, then pass the returned id as `temporaryObjectKey`.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 255
                  description: The name of the regression test
                  example: Checkout regression test
                additionalContext:
                  type: string
                  minLength: 1
                  maxLength: 4096
                  description: Free-form context given to the agent alongside the source report
                  example: Focus on the checkout flow.
                inputFilename:
                  type: string
                  minLength: 1
                  maxLength: 255
                  description: The name of the uploaded source report file
                  example: report.pdf
                inputFormat:
                  type: string
                  enum:
                  - MARKDOWN
                  - PDF
                  description: The format of the source report. Inferred from the filename when omitted.
                  example: PDF
                temporaryObjectKey:
                  type: string
                  format: uuid
                  description: The id returned by POST /v3/upload/signed-url. The file must have been uploaded to the signed URL before calling this endpoint.
                  example: 00000000-0000-0000-0000-000000000000
              required:
              - name
              - additionalContext
              - inputFilename
              - temporaryObjectKey
              title: CreateRegressionTestInput
              description: The source report is uploaded beforehand with POST /v3/upload/signed-url, which returns an id to pass as `temporaryObjectKey`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                    description: The id of the regression test
                  name:
                    type: string
                    description: The name of the regression test
                  additionalContext:
                    type: string
                    description: Free-form context given to the agent alongside the source report
                  inputFilename:
                    type: string
                    description: The name of the uploaded source report file
                  inputFormat:
                    type: string
                    enum:
                    - MARKDOWN
                    - PDF
                    description: The format of the source report
                  status:
                    type: string
                    enum:
                    - CANCELLED
                    - CLARIFICATION_GIVEN
                    - CLARIFICATION_REQUIRED
                    - ERROR
                    - NOT_STARTED
                    - RUNNING
                    - TEST_FAILED
                    - TEST_PASSED
                    description: The status of the latest run of the regression test
                  signedUrl:
                    type: string
                    description: A signed URL to download the source report. It expires after a short period.
                  createdAt:
                    type: string
                    description: When the regression test was created
                  updatedAt:
                    type: string
                    description: When the regression test was last updated
                  runs:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                          description: The id of the regression test run
                        status:
                          type: string
                          enum:
                          - CANCELLED
                          - CLARIFICATION_GIVEN
                          - CLARIFICATION_REQUIRED
                          - ERROR
                          - NOT_STARTED
                          - RUNNING
                          - TEST_FAILED
                          - TEST_PASSED
                          description: The status of the run
                        clarificationQuestion:
                          type:
                          - string
                          - 'null'
                          description: The question the agent asked, when the run needs a clarification
                        clarificationAnswer:
                          type:
                          - string
                          - 'null'
                          description: The answer given to the clarification question
                        validationId:
                          type:
                          - string
                          - 'null'
                          description: The id of the validation (scan) that ran the test
                        createdAt:
                          type: string
                          description: When the run was created
                        updatedAt:
                          type: string
                          description: When the run was last updated
                      required:
                      - id
                      - status
                      - clarificationQuestion
                      - clarificationAnswer
                      - validationId
                      - createdAt
                      - updatedAt
                      title: RegressionTestRun
                      description: A single run of a regression test
                    description: The most recent runs of the regression test, most recent first. Capped; page through all runs with GET /v3/regression-tests/{regressionTestId}/history.
                  hasMoreRuns:
                    type: boolean
                    description: Whether more runs exist beyond the embedded `runs`. Page through all runs with GET /v3/regression-tests/{regressionTestId}/history.
                required:
                - id
                - name
                - additionalContext
                - inputFilename
                - inputFormat
                - status
                - signedUrl
                - createdAt
                - updatedAt
                - runs
                - hasMoreRuns
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    enum:
                    - Bad Request
                  details:
                    type: string
                required:
                - message
                - details
                title: BadRequest
                description: Returned when the request payload fails validation
