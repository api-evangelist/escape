openapi: 3.2.0
info:
  version: 3.0.0
  title: Escape Public Upload API
  description: 'This API enables you to operate Escape programmatically.


    All requests must be authenticated with a valid API key, provided in the `X-ESCAPE-API-KEY` header.

    For example: `X-ESCAPE-API-KEY: YOUR_API_KEY`.


    You can find your API key in the Escape dashboard.'
servers:
- url: https://public.escape.tech/v3
security:
- apiKey: []
tags:
- name: Upload
  description: 'Upload helper for Escape Platform.


    The public API provides endpoints to upload files to the platform.'
paths:
  /upload/signed-url:
    post:
      tags:
      - Upload
      summary: Create signed URL
      operationId: createUploadSignedUrl
      description: 'Retrieve a signed URL link to upload a file to the Escape Platform.


        By running a query with this endpoint, you will receive a signed URL that you can use to upload a file to the Escape Platform.


        ```json

        {

        "url": "[SIGNED URL]",

        "id": "[SIGNED URL ID]"

        }

        ```


        With the url, you are able to upload one file:


        ```bash

        curl -X PUT --data-binary ''@./schema.json'' "[SIGNED URL]"

        ```


        Now, you are able to use the previously received id in another query.

        For example to update a schema of your application.


        Optionally pass `contentType` and `filename` query parameters so the uploaded object keeps its

        MIME type and original name:


        ```bash

        curl -X POST "/v3/upload/signed-url?contentType=application/json&filename=schema.har"

        ```


        When `contentType` is provided it is part of the signed request, so the `PUT` must send the same

        `Content-Type` header:


        ```bash

        curl -X PUT -H "Content-Type: application/json" --data-binary ''@./schema.json'' "[SIGNED URL]"

        ```'
      parameters:
      - schema:
          type: string
          minLength: 1
          maxLength: 255
          description: The MIME type of the file to upload, e.g. `application/json`. Stored on the uploaded object. When provided, the `PUT` must send the same `Content-Type`.
          example: application/json
        required: false
        description: The MIME type of the file to upload, e.g. `application/json`. Stored on the uploaded object. When provided, the `PUT` must send the same `Content-Type`.
        name: contentType
        in: query
      - schema:
          type: string
          minLength: 1
          maxLength: 255
          description: The original file name, e.g. `schema.har`. Used to build the storage key so the uploaded object keeps its original name.
          example: schema.har
        required: false
        description: The original file name, e.g. `schema.har`. Used to build the storage key so the uploaded object keeps its original name.
        name: filename
        in: query
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                    maxLength: 1024
                    format: uri
                    description: The signed URL to upload a file to the Escape Platform.
                  id:
                    type: string
                    format: uuid
                    description: The signed URL ID to upload a file to the Escape Platform.
                required:
                - url
                - id
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-ESCAPE-API-KEY
