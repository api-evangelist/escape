      tags:
      - SecurityTests
      summary: Get a security test
      operationId: getSecurityTest
      description: Get a security test from the organization catalog by uid, with its organization configuration (enabled state and custom severity) and open issue counts.
      parameters:
      - schema:
          type: string
          description: The uid of the security test
          example: ISSUE_SQL_INJECTION
        required: true
        description: The uid of the security test
        name: securityTestUid
        in: path
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: The uid of the security test
                  name:
                    type: string
                    description: The human readable name of the security test
                  category:
                    type: string
                    enum:
                    - ACCESS_CONTROL
                    - CONFIGURATION
                    - CUSTOM
                    - INFORMATION_DISCLOSURE
                    - INJECTION
                    - PROTOCOL
                    - REQUEST_FORGERY
                    - RESOURCE_LIMITATION
                    - SCHEMA
                    - SENSITIVE_DATA
