                      - ASM_POSTMAN_ENVIRONMENT
                      - ASM_REST
                      - ASM_SOAP
                      - ASM_SOFTWARE
                      - ASM_WEBAPP
                      - ASM_WEBSOCKET
                      - ASM_WP_JSON
                      - AUTOMATED_PENTEST
                      - BLST_GRAPHQL
                      - BLST_REST
                      - CONTINUOUS_PENTEST
                      - EXTERNAL_NETWORK_PENTEST
                      - FRONTEND_DAST
                      - MOBILE_APP_PENTEST
                      - RETEST
                    description: Scanner kinds that can run this security test
                  assetTypes:
