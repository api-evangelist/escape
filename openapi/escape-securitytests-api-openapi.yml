                required:
                - message
                title: NotFound
                description: Returned when the requested resource does not exist
    put:
      tags:
      - SecurityTests
      summary: Update a security test
      operationId: updateSecurityTest
      description: 'Update the organization configuration of a security test: enable or disable it, and/or override the severity assigned to its issues. At least one of `enabled` or `customSeverity` is required. Omitted fields are left unchanged. Pass `customSeverity: null` to reset the override to the scanner default.'
      parameters:
      - schema:
          type: string
          description: The security test ID (UID)
          example: ISSUE_AGENTIC_SQL_INJECTION
        required: true
        description: The security test ID (UID)
        name: securityTestUid
        in: path
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: boolean
                  description: Whether the security test is enabled for your organization
                customSeverity:
                  type:
                  - string
                  - 'null'
                  enum:
                  - CRITICAL
                  - HIGH
                  - INFO
                  - LOW
                  - MEDIUM
                  - null
                  description: The severity override for this security test. Pass null to reset to the scanner default. Omit to leave the current override unchanged.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: The uid of the security test
                  name:
                    type: string
                    description: The human readable name of the security test
                  category:
                    type: string
                    enum:
                    - ACCESS_CONTROL
                    - CONFIGURATION
                    - CUSTOM
                    - INFORMATION_DISCLOSURE
                    - INJECTION
                    - PROTOCOL
                    - REQUEST_FORGERY
                    - RESOURCE_LIMITATION
                    - SCHEMA
                    - SENSITIVE_DATA
                    description: The issue category this test belongs to
                  description:
                    type: string
                    description: The description of the security test
                  documentationPath:
                    type: string
                    description: Relative path to the security test documentation
                  scanners:
                    type: array
                    items:
                      type: string
                      enum:
                      - ASM_APK
                      - ASM_AWS_LAMBDA
                      - ASM_BITBUCKET_REPOSITORY
                      - ASM_BURPSUITE_EXPORT
                      - ASM_CODE_PROJECT
                      - ASM_DNS
                      - ASM_GITHUB_REPOSITORY
                      - ASM_GITLAB_REPOSITORY
                      - ASM_GRAPHQL
                      - ASM_GRAPHQL_SCHEMA
                      - ASM_GRPC
                      - ASM_HAR_EXPORT
                      - ASM_INSOMNIA
                      - ASM_IPV4
                      - ASM_IPV4_RANGE
                      - ASM_IPV6
                      - ASM_MCP
                      - ASM_OPENAPI
                      - ASM_PACKAGE
                      - ASM_POSTMAN_COLLECTION
                      - ASM_POSTMAN_ENVIRONMENT
                      - ASM_REST
                      - ASM_SOAP
                      - ASM_SOFTWARE
                      - ASM_WEBAPP
                      - ASM_WEBSOCKET
                      - ASM_WP_JSON
                      - AUTOMATED_PENTEST
                      - BLST_GRAPHQL
                      - BLST_REST
                      - CONTINUOUS_PENTEST
                      - EXTERNAL_NETWORK_PENTEST
                      - FRONTEND_DAST
                      - MOBILE_APP_PENTEST
                      - RETEST
                    description: Scanner kinds that can run this security test
                  assetTypes:
                    type: array
                    items:
                      type: string
                      enum:
                      - APK
                      - AWS_LAMBDA
                      - BITBUCKET_REPOSITORY
                      - BURPSUITE_EXPORT
                      - CODE_PROJECT
                      - DNS
                      - GITHUB_REPOSITORY
                      - GITLAB_REPOSITORY
                      - GRAPHQL
                      - GRAPHQL_SCHEMA
                      - GRPC
                      - HAR_EXPORT
                      - INSOMNIA
                      - IPV4
                      - IPV4_RANGE
                      - IPV6
                      - MCP
                      - OPENAPI
                      - PACKAGE
                      - POSTMAN_COLLECTION
                      - POSTMAN_ENVIRONMENT
                      - REST
                      - SOAP
                      - SOFTWARE
                      - WEBAPP
                      - WEBSOCKET
                      - WP_JSON
                    description: Asset types this security test applies to
                  enabled:
                    type: boolean
                    description: Whether the test is enabled for the organization (defaults to true)
                  defaultSeverity:
                    type:
                    - string
                    - 'null'
                    enum:
                    - CRITICAL
                    - HIGH
                    - INFO
                    - LOW
                    - MEDIUM
                    - null
                    description: The default severity of the test
                  customSeverity:
                    type:
                    - string
                    - 'null'
                    enum:
                    - CRITICAL
                    - HIGH
                    - INFO
                    - LOW
                    - MEDIUM
                    - null
                    description: The organization override of the severity, null when not overridden
                  severity:
                    type:
                    - string
                    - 'null'
                    enum:
                    - CRITICAL
                    - HIGH
                    - INFO
                    - LOW
                    - MEDIUM
                    - null
                    description: 'The effective severity: `customSeverity` when set, otherwise `defaultSeverity`'
                  cvssScore:
                    type:
                    - number
                    - 'null'
                    description: The CVSS score of the test, when available
                  cvssVector:
                    type:
                    - string
                    - 'null'
                    description: The CVSS vector of the test, when available
                  compliance:
                    type: array
                    items:
                      type: object
                      properties:
                        framework:
                          type: string
                          enum:
                          - BITSIGHT
                          - CRA
                          - CWE
                          - DORA
                          - FEDRAMP
                          - GDPR
                          - HIPAA
                          - HITRUST_CSF
                          - IEC62443
                          - ISO27001
                          - MITRE_ATTACK
                          - NIS2
                          - NIST
                          - OWASP
                          - OWASP_ASVS
                          - OWASP_LLM
                          - PCI_DSS
                          - PSD2
                          - SECURITY_SCORECARD
                          - SOC2
                          - WASC
                          description: The compliance framework name
                        item:
                          type: string
                          description: The compliance item identifier within the framework
                      required:
                      - framework
                      - item
                      title: SecurityTestCompliance
                    description: Compliance mappings associated with the test
                  issueCounts:
                    type: object
                    properties:
                      critical:
                        type: integer
                        description: Number of open CRITICAL issues for this test
                      high:
                        type: integer
                        description: Number of open HIGH issues for this test
                      medium:
                        type: integer
                        description: Number of open MEDIUM issues for this test
                      low:
                        type: integer
                        description: Number of open LOW issues for this test
                      info:
                        type: integer
                        description: Number of open INFO issues for this test
                    required:
                    - critical
                    - high
                    - medium
                    - low
                    - info
                    title: SecurityTestIssueCounts
                    description: Open issue counts for this test in the organization
                required:
                - id
                - name
                - category
                - description
                - documentationPath
                - scanners
                - assetTypes
                - enabled
                - defaultSeverity
                - customSeverity
                - severity
                - cvssScore
                - cvssVector
                - compliance
                - issueCounts
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    enum:
                    - Bad Request
                  details:
                    type: string
                required:
                - message
                - details
                title: BadRequest
                description: Returned when the request payload fails validation
        '404':
          description: Not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    enum:
                    - Not found
                required:
                - message
                title: NotFound
                description: Returned when the requested resource does not exist
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-ESCAPE-API-KEY
