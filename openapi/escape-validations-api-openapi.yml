      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                    description: Identifier for this validation; use it when polling for status
                  status:
                    type: string
                    enum:
                    - CANCELED
                    - FAILED
                    - FINISHED
                    - RUNNING
                    - STARTING
                    description: Initial lifecycle state (typically STARTING right after creation)
                required:
                - id
                - status
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    enum:
                    - Bad Request
                  details:
                    type: string
                required:
                - message
                - details
                title: BadRequest
                description: Returned when the request payload fails validation
  /validations/{validationId}:
    get:
      tags:
      - Validations
      summary: Get target validation status
      operationId: getValidation
      description: Returns the current status, progress, output, and events for a validation started via `POST /validations`.
      parameters:
      - schema:
          type: string
          format: uuid
          description: Identifier returned by the start endpoint
        required: true
        description: Identifier returned by the start endpoint
        name: validationId
        in: path
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                    description: Identifier of this validation
                  status:
                    type: string
                    enum:
                    - CANCELED
                    - FAILED
                    - FINISHED
                    - RUNNING
                    - STARTING
                    description: Current lifecycle state
                  progressRatio:
                    type: number
                    description: Approximate progress between 0 and 1 while the validation is running
                  createdAt:
                    type: string
                    description: When the validation was started
                  output:
                    description: Null while the validation is running. When FINISHED, contains the validation result (reachable assets, authentication results, etc.)
                  events:
                    type: array
                    items:
                      type: object
                      properties:
                        createdAt:
                          type: string
                          description: When this event was recorded
                        level:
                          type: string
                          enum:
                          - DEBUG
                          - ERROR
                          - INFO
                          - WARNING
                          description: Severity of the message
                        stage:
                          type: string
                          enum:
                          - AGENT_ACTION
                          - AGENT_REASONING
                          - CONFIGURATION
                          - EXECUTION
                          description: Phase of the validation
                        title:
                          type: string
                          description: Short headline for the message
                        description:
                          type: string
                          description: Full message body
                      required:
                      - createdAt
                      - level
                      - stage
                      - title
                      - description
                      title: ValidationEvent
                      description: A single progress or diagnostic message from a target validation
                    description: Chronological messages from the validation, including errors
                required:
                - id
                - status
                - progressRatio
                - createdAt
                - events
        '404':
          description: Not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    enum:
                    - Not found
                required:
                - message
                title: NotFound
                description: Returned when the requested resource does not exist
