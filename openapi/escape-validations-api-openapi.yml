openapi: 3.2.0
info:
  version: 3.0.0
  title: Escape Public Validations API
  description: 'This API enables you to operate Escape programmatically.


    All requests must be authenticated with a valid API key, provided in the `X-ESCAPE-API-KEY` header.

    For example: `X-ESCAPE-API-KEY: YOUR_API_KEY`.


    You can find your API key in the Escape dashboard.'
servers:
- url: https://public.escape.tech/v3
security:
- apiKey: []
tags:
- name: Validations
  description: 'Target validations.


    Start a validation to check that a target (asset) is reachable and in scope, then poll for status and output.'
paths:
  /validations:
    post:
      tags:
      - Validations
      summary: Start a target validation
      operationId: startValidation
      description: Validates that a target (asset) is reachable and in scope without running a full scan. The asset type determines the validation workflow (DNS, IP, range, REST, GraphQL, webapp). Poll `GET /validations/{id}` until `status` is FINISHED, FAILED, or CANCELED.
