        required: true
        description: The scan ID
        name: scanId
        in: path
      - schema:
          type: string
          description: The cursor to start the pagination from. Returned by the previous page response. If not provided, the first page will be returned.
          example: R1BDOlM6NTEwMzk4NTYtNGIyOS00NTlkLTg0ZDYtMWJhYjM0NWMzZjU5
        required: false
        description: The cursor to start the pagination from. Returned by the previous page response. If not provided, the first page will be returned.
        name: cursor
        in: query
      - schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
          description: The number of items to return per page
          example: 50
        required: false
        description: The number of items to return per page
        name: size
        in: query
      - schema:
          type: string
          enum:
          - BUSINESS_LOGIC
          - DATA_INTEGRITY
          - IDENTITY_AND_ACCESS_CONTROL
          - INJECTION
          - INSECURE_DATA_HANDLING
          - LLM_AND_AI
          - PLATFORM_AND_FRAMEWORK
          - PROTOCOL_AND_API
          - SECRETS_AND_CRYPTOGRAPHY
