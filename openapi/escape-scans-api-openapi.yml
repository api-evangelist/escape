  /scans/{scanId}/scenarios:
    get:
      tags:
      - Scans
      summary: List attack scenarios for a scan
      operationId: listScanScenarios
      description: Returns the attack scenarios explored during an AI pentest scan, each mapped to its attack vector. Filter by vector to build the vector/scenario matrix, or search scenario titles and surfaces. Credentials and secrets in scenario descriptions are redacted.
      parameters:
      - schema:
          type: string
          format: uuid
