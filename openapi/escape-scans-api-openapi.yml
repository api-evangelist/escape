  /scans/{scanId}/targets/ai-summaries:
    post:
      tags:
      - Scans
      summary: Generate an AI summary for a scan target
      operationId: generateScanTargetAISummary
      description: Generate an AI exploration or pentesting summary for a target of a DAST scan and return it. The target must belong to the scan. Generated summaries are also readable on the target through the scan targets endpoint.
      parameters:
      - schema:
          type: string
          format: uuid
          description: The scan ID
          example: 00000000-0000-0000-0000-000000000000
        required: true
        description: The scan ID
        name: scanId
        in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                targetId:
                  type: string
                  format: uuid
                  description: The ID of the target to summarize
                  example: 00000000-0000-0000-0000-000000000001
                kind:
                  type: string
                  enum:
                  - EXPLORATION
                  - PENTESTING
                  description: The kind of summary to generate
                  example: EXPLORATION
              required:
              - targetId
              - kind
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  summary:
                    type: string
                    description: The generated summary, in Markdown
                required:
                - summary
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    enum:
                    - Bad Request
                  details:
                    type: string
                required:
                - message
                - details
                title: BadRequest
                description: Returned when the request payload fails validation
        '404':
          description: Not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    enum:
                    - Not found
                required:
                - message
                title: NotFound
                description: Returned when the requested resource does not exist
