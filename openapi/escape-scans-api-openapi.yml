openapi: 3.2.0
info:
  version: 3.0.0
  title: Escape Public Scans API
  description: 'This API enables you to operate Escape programmatically.


    All requests must be authenticated with a valid API key, provided in the `X-ESCAPE-API-KEY` header.

    For example: `X-ESCAPE-API-KEY: YOUR_API_KEY`.


    You can find your API key in the Escape dashboard.'
servers:
- url: https://public.escape.tech/v3
security:
- apiKey: []
tags:
- name: Scans
  description: 'A Scan is a run of the DAST or ASM scanning feature on an profile (DAST/ASM).


    With the public API, you can trigger scans, track their status, and retrieve their results.


    See our documentation for more details.'
paths:
  /scans:
    get:
      tags:
      - Scans
      summary: List scans
      operationId: listScans
      description: List and search scans of the organization.
      parameters:
      - schema:
          type: string
          description: The cursor to start the pagination from. Returned by the previous page response. If not provided, the first page will be returned.
          example: R1BDOlM6NTEwMzk4NTYtNGIyOS00NTlkLTg0ZDYtMWJhYjM0NWMzZjU5
        required: false
        description: The cursor to start the pagination from. Returned by the previous page response. If not provided, the first page will be returned.
        name: cursor
        in: query
      - schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
          description: The number of items to return per page
          example: 50
        required: false
        description: The number of items to return per page
        name: size
        in: query
      - schema:
          type: string
          enum:
          - SEVERITY
          - createdAt
          description: The type to sort by
        required: false
        description: The type to sort by
        name: sortType
        in: query
      - schema:
          type: string
          enum:
          - asc
          - desc
          default: asc
          description: The direction to sort by
        required: false
        description: The direction to sort by
        name: sortDirection
        in: query
      - schema:
          type: string
          description: Filter by after date
          example: '2025-03-15T09:00:00Z'
        required: false
        description: Filter by after date
        name: after
        in: query
      - schema:
          type: string
          description: Filter by before date
          example: '2025-03-15T09:00:00Z'
        required: false
        description: Filter by before date
        name: before
        in: query
      - schema:
          type: string
          description: Search term to filter scans
          example: scan
        required: false
        description: Search term to filter scans
        name: search
        in: query
      - schema:
          anyOf:
          - type: string
          - type: array
            items:
              type: string
          description: Filter by asset IDs
          example: 00000000-0000-0000-0000-000000000000,00000000-0000-0000-0000-000000000001
        required: false
        description: Filter by asset IDs
        name: assetIds
        in: query
      - schema:
          anyOf:
          - type: string
          - type: array
            items:
              type: string
          description: Filter by profile IDs
          example: 00000000-0000-0000-0000-000000000000,00000000-0000-0000-0000-000000000001
        required: false
        description: Filter by profile IDs
        name: profileIds
        in: query
      - schema:
          anyOf:
          - type: string
          - type: array
            items:
              type: string
          description: Filter by tag IDs
        required: false
        description: Filter by tag IDs
        name: tagIds
        in: query
      - schema:
          type: array
          items:
            type: string
            enum:
            - APK
            - AWS_LAMBDA
            - BITBUCKET_REPOSITORY
            - BURPSUITE_EXPORT
            - CODE_PROJECT
            - DNS
            - GITHUB_REPOSITORY
            - GITLAB_REPOSITORY
            - GRAPHQL
            - GRAPHQL_SCHEMA
            - GRPC
            - HAR_EXPORT
            - INSOMNIA
            - IPV4
            - IPV4_RANGE
            - IPV6
            - MCP
            - OPENAPI
            - PACKAGE
            - POSTMAN_COLLECTION
            - POSTMAN_ENVIRONMENT
            - REST
            - SOAP
            - SOFTWARE
            - WEBAPP
            - WEBSOCKET
            - WP_JSON
          description: Filter by asset types
        required: false
        description: Filter by asset types
        name: assetTypes
        in: query
      - schema:
          type: string
          enum:
          - 'true'
          - 'false'
          example: 'true'
          description: Filter by ignored status
        required: false
        description: Filter by ignored status
        name: ignored
        in: query
      - schema:
          type: array
          items:
            type: string
            enum:
            - APPLICATION_CREATION
            - CI
            - INVENTORY
            - MANUAL
            - SCHEDULED
            - UNKNOWN
          description: Filter by initiator
        required: false
        description: Filter by initiator
        name: initiator
        in: query
      - schema:
          type: array
          items:
            type: string
            enum:
            - ASM_APK
            - ASM_AWS_LAMBDA
            - ASM_BITBUCKET_REPOSITORY
            - ASM_BURPSUITE_EXPORT
            - ASM_CODE_PROJECT
            - ASM_DNS
            - ASM_GITHUB_REPOSITORY
            - ASM_GITLAB_REPOSITORY
            - ASM_GRAPHQL
            - ASM_GRAPHQL_SCHEMA
            - ASM_GRPC
            - ASM_HAR_EXPORT
            - ASM_INSOMNIA
            - ASM_IPV4
            - ASM_IPV4_RANGE
            - ASM_IPV6
            - ASM_MCP
            - ASM_OPENAPI
            - ASM_PACKAGE
            - ASM_POSTMAN_COLLECTION
            - ASM_POSTMAN_ENVIRONMENT
            - ASM_REST
            - ASM_SOAP
            - ASM_SOFTWARE
            - ASM_WEBAPP
            - ASM_WEBSOCKET
            - ASM_WP_JSON
            - AUTOMATED_PENTEST
            - BLST_GRAPHQL
            - BLST_REST
            - CONTINUOUS_PENTEST
            - EXTERNAL_NETWORK_PENTEST
            - FRONTEND_DAST
            - MOBILE_APP_PENTEST
            - RETEST
            - AUTOMATED_PENTEST_WEBAPP
            - AUTOMATED_PENTEST_REST
            - AUTOMATED_PENTEST_GRAPHQL
          description: Filter by kind
        required: false
        description: Filter by kind
        name: kinds
        in: query
      - schema:
          type: array
          items:
            type: string
            enum:
            - CANCELED
            - FAILED
            - FINISHED
            - RUNNING
            - STARTING
          description: Filter by status
        required: false
        description: Filter by status
        name: status
        in: query
      - schema:
          anyOf:
          - type: string
          - type: array
            items:
              type: string
          description: Filter by project IDs
          example: 00000000-0000-0000-0000-000000000000,00000000-0000-0000-0000-000000000001
        required: false
        description: Filter by project IDs
        name: projectIds
        in: query
      - schema:
          type: array
          items:
            type: string
            enum:
            - AUTH_FAILURE
            - BLOCKED_BY_CORS
            - BLOCKED_BY_WAF
            - CAPTCHA_HIT
            - CONFIGURATION_IMPROVEMENT
            - HIGH_NUMBER_OF_ERROR_ENDPOINTS
            - INTEGRATION_ERROR
            - NO_AUTHENTICATION_CONFIGURED
            - NO_SCHEMA_FOUND
            - PL_FAILURE
            - RATE_LIMIT_EXCEEDED
            - SCHEMA_IMPROVEMENT
            - TIMEOUT
            - UNEXPECTED_ERROR
            - UNREACHABLE_ASSET
          description: Filter by problem codes
        required: false
        description: Filter by problem codes
        name: problemCodes
        in: query
      - schema:
          type: array
          items:
            type: string
            enum:
            - ERROR
            - INFO
            - WARNING
          description: Filter by problem severities
        required: false
        description: Filter by problem severities
        name: problemSeverities
        in: query
      - schema:
          type: string
          enum:
          - 'true'
          - 'false'
          example: 'true'
          description: Filter by assets with no tags
        required: false
        description: Filter by assets with no tags
        name: noTags
        in: query
      - schema:
          type: string
          description: Filter by commit branch. Not supported by the GraphQL where input, so it is applied after fetching.
        required: false
        description: Filter by commit branch. Not supported by the GraphQL where input, so it is applied after fetching.
        name: commitBranch
        in: query
      - schema:
          type: string
          enum:
          - 'true'
          - 'false'
          example: 'true'
          description: Keep only the latest scan of each commit branch. Not supported by the GraphQL where input, so it is applied after fetching.
        required: false
        description: Keep only the latest scan of each commit branch. Not supported by the GraphQL where input, so it is applied after fetching.
        name: latestBranchScans
        in: query
      - schema:
          type: string
          description: Filter by DNF expression
        required: false
        description: Filter by DNF expression
        name: dnf
        in: query
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  nextCursor:
                    type:
                    - string
                    - 'null'
                  totalCount:
                    type: integer
                    default: 100
                    example: 20
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                          description: The id of the scan
                        profileId:
                          type:
                          - string
                          - 'null'
                          format: uuid
                          description: The id of the profile that ran the scan
                        assetId:
                          type:
                          - string
                          - 'null'
                          format: uuid
                          description: The id of the asset that was scanned, if any
                        status:
                          type: string
                          description: The status of the scan
                        createdAt:
                          type: string
                          description: The date and time the scan was created
                        finishedAt:
                          type:
                          - string
                          - 'null'
                          description: The date and time the scan was finished
                        score:
                          type:
                          - number
                          - 'null'
                          description: The score of the scan
                        coverage:
                          type:
                          - number
                          - 'null'
                          description: Aggregate API coverage ratio for this scan (0–1), when the scan has finished with coverage data
                        duration:
                          type: number
                          description: The duration of the scan
                        progressRatio:
                          type: number
                          description: The progress ratio of the scan
                        initiator:
                          type: string
                          description: The initiator of the scan
                        kind:
                          type: string
                          description: The kind of the scan
                        commitHash:
                          type:
                          - string
                          - 'null'
                          description: The commit hash of the scan
                        commitBranch:
                          type:
                          - string
                          - 'null'
                          description: The commit branch of the scan
                        links:
                          type: object
                          properties:
                            scanIssues:
                              type: string
                              description: The url to view the scan issues in the platform
                          required:
                          - scanIssues
                          description: The links of the scan
                      required:
                      - id
                      - profileId
                      - assetId
                      - status
                      - createdAt
                      - finishedAt
                      - score
                      - coverage
                      - duration
                      - progressRatio
                      - initiator
                      - kind
                      - commitHash
                      - commitBranch
                      - links
                      title: ScanSummarized
                      description: Summarized information about a scan
                required:
                - nextCursor
                - data
        '400':
          description: Pagination error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    enum:
                    - Invalid cursor
                    - Branch filters page limit reached
                  details:
                    type: string
                required:
                - message
                - details
                title: PaginationError
                description: Returned when an invalid pagination cursor is supplied or when the branch filters page limit is reached
    post:
      tags:
      - Scans
      summary: Start a new scan
      operationId: startScan
      requestBody:
        description: Body of the request to start a new scan
        content:
          application/json:
            schema:
              type: object
              properties:
                profileId:
                  type: string
                  description: The profile ID to use
                  example: 00000000-0000-0000-0000-000000000000
                commitHash:
                  type: string
                  description: The commit hash to scan
                  example: abc123
                commitLink:
                  type: string
                  description: The commit link to scan
                  example: https://example.com/example
                commitBranch:
                  type: string
                  description: The commit branch to scan
                  example: master
                commitAuthor:
                  type: string
                  description: The commit author to scan
                  example: alice
                commitAuthorProfilePictureLink:
                  type: string
                  description: The commit author profile picture link to scan
                  example: https://example.com/example.png
                forceLockBypass:
                  type: boolean
                  description: Bypass the lock that prevents concurrent scans of the same profile
                  example: false
                configurationOverride:
                  description: The configuration override to use
                  examples:
                  - mode: read_write
                  - '{"mode":"read_write"}'
                initiator:
                  type:
                  - string
                  - 'null'
                  enum:
                  - CI
                  - MANUAL
                  - SCHEDULED
                  - null
                  default: CI
                  description: The initiator of the scan
              required:
              - profileId
            example:
              profileId: 00000000-0000-0000-0000-000000000000
              initiator: MANUAL
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                    description: The id of the scan
                  status:
                    type: string
                    description: The status of the scan
                  createdAt:
                    type: string
                    description: The date and time the scan was created
                  updatedAt:
                    type: string
                    description: The date and time the scan was updated
                  finishedAt:
                    type:
                    - string
                    - 'null'
                    description: The date and time the scan was finished
                  score:
                    type:
                    - number
                    - 'null'
                    description: The score of the scan
                  coverage:
                    type:
                    - number
                    - 'null'
                    description: Aggregate API coverage ratio for this scan (0–1), when the scan has finished with coverage data
                  duration:
                    type: number
                    description: The duration of the scan
                  progressRatio:
                    type: number
                    description: The progress ratio of the scan
                  initiator:
                    type: string
                    description: The initiator of the scan
                  kind:
                    type: string
                    description: The kind of the scan
                  profileId:
                    type: string
                    description: The id of the profile of the scan
                  organizationId:
                    type: string
                    description: The id of the organization of the scan
                  commitHash:
                    type:
                    - string
                    - 'null'
                  commitBranch:
                    type:
                    - string
                    - 'null'
                  commitAuthor:
                    type:
                    - string
                    - 'null'
                  commitLink:
                    type:
                    - string
                    - 'null'
                  commitAuthorProfilePictureLink:
                    type:
                    - string
                    - 'null'
                  ignored:
                    type: boolean
                    description: Whether the scan is ignored. Only returned by the scan detail endpoint.
                  executiveSummary:
                    type:
                    - string
                    - 'null'
                    description: AI-generated executive summary of the scan. Credentials and secrets are redacted. Only returned by the scan detail endpoint.
                  scopeSummary:
                    type:
                    - string
                    - 'null'
                    description: AI-generated summary of the scanned scope. Credentials and secrets are redacted. Only returned by the scan detail endpoint.
                  problems:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                          description: The id of the problem
                        code:
                          type: string
                          enum:
                          - AUTH_FAILURE
                          - BLOCKED_BY_CORS
                          - BLOCKED_BY_WAF
                          - CAPTCHA_HIT
                          - CONFIGURATION_IMPROVEMENT
                          - HIGH_NUMBER_OF_ERROR_ENDPOINTS
                          - INTEGRATION_ERROR
                          - NO_AUTHENTICATION_CONFIGURED
                          - NO_SCHEMA_FOUND
                          - PL_FAILURE
                          - RATE_LIMIT_EXCEEDED
                          - SCHEMA_IMPROVEMENT
                          - TIMEOUT
                          - UNEXPECTED_ERROR
                          - UNREACHABLE_ASSET
                          description: The problem code
                        message:
                          type: string
                          description: The problem message
                        severity:
                          type: string
                          enum:
                          - ERROR
                          - INFO
                          - WARNING
                          description: The problem severity
                        createdAt:
                          type: string
                          description: The date and time the problem was created
                      required:
                      - id
                      - code
                      - message
                      - severity
                      - createdAt
                      title: ScanProblem
                      description: A validation problem surfaced by the scanner during a scan
                    description: Validation problems surfaced by the scanner during this scan. Only returned by the scan detail endpoint.
                  artefacts:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                          description: The id of the artefact
                        kind:
                          type: string
                          enum:
                          - AUDITOR_REPORT
                          - EVENTS_ARCHIVE
                          - EXCHANGES_ARCHIVE
                          - EXECUTIVE_REPORT
                          - EXPORT_JOB_RESULT
                          description: The kind of the artefact
                        name:
                          type: string
                          description: The name of the artefact
                        signedUrl:
                          type: string
                          description: Time-limited HTTPS download URL for the artefact
                        createdAt:
                          type: string
                          description: The date and time the artefact was created
                        updatedAt:
                          type: string
                          description: The date and time the artefact was updated
                      required:
                      - id
                      - kind
                      - name
                      - signedUrl
                      - createdAt
                      - updatedAt
                      title: ScanArtefact
                      description: A file produced by a scan; signedUrl is a time-limited download link
                    description: Files produced by this scan, such as executive reports. Only returned by the scan detail endpoint.
                  links:
                    type: object
                    properties:
                      scanIssues:
                        type: string
                        description: URL to view the scan issues in the platform
                    required:
                    - scanIssues
                required:
                - id
                - status
                - createdAt
                - updatedAt
                - finishedAt
                - score
                - coverage
                - duration
                - progressRatio
                - initiator
                - kind
                - profileId
                - organizationId
                - commitHash
                - commitBranch
                - commitAuthor
                - commitLink
                - commitAuthorProfilePictureLink
                - links
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    enum:
                    - Bad Request
                  details:
                    type: string
                required:
                - message
                - details
                title: BadRequest
                description: Returned when the request payload fails validation
