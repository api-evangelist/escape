                          - INJECTION
                          - INSECURE_DATA_HANDLING
                          - LLM_AND_AI
                          - PLATFORM_AND_FRAMEWORK
                          - PROTOCOL_AND_API
                          - SECRETS_AND_CRYPTOGRAPHY
                          - SSRF_AND_FILE_INCLUSION
                          - WEB_AND_BROWSER
                          description: The attack vector the scenario belongs to
                        surfaces:
                          type: array
                          items:
                            type: string
                          description: The attack surfaces covered by the scenario
                      required:
                      - id
                      - title
                      - description
                      - status
