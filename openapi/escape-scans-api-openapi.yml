            - SCHEDULED
            - UNKNOWN
          description: Filter by initiator
        required: false
        description: Filter by initiator
        name: initiator
        in: query
      - schema:
          type: array
          items:
            type: string
            enum:
            - ASM_APK
            - ASM_AWS_LAMBDA
            - ASM_BITBUCKET_REPOSITORY
            - ASM_BURPSUITE_EXPORT
            - ASM_CODE_PROJECT
            - ASM_DNS
