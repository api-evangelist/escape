          example: INJECTION
        required: false
        description: Filter scenarios by attack vector
        name: vector
        in: query
      - schema:
          type: string
          description: Filter scenarios by text found in the title or surfaces
          example: catalog/product
        required: false
        description: Filter scenarios by text found in the title or surfaces
        name: search
        in: query
      responses:
