  /workflows/{id}/executions:
    get:
      tags:
      - Workflows
      summary: List workflow executions
      operationId: listWorkflowExecutions
      description: 'List the execution history of a workflow: the asynchronous jobs scheduled each time the workflow ran, most recent first.'
      parameters:
      - schema:
          type: string
          format: uuid
          description: The workflow ID
          example: 00000000-0000-0000-0000-000000000000
        required: true
        description: The workflow ID
        name: id
        in: path
      - schema:
          type: string
          description: The cursor to start the pagination from. Returned by the previous page response. If not provided, the first page will be returned.
          example: R1BDOlM6NTEwMzk4NTYtNGIyOS00NTlkLTg0ZDYtMWJhYjM0NWMzZjU5
        required: false
        description: The cursor to start the pagination from. Returned by the previous page response. If not provided, the first page will be returned.
        name: cursor
        in: query
      - schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
          description: The number of items to return per page
          example: 50
        required: false
        description: The number of items to return per page
        name: size
        in: query
      - schema:
          type: string
          enum:
          - CREATED_AT
          - SCHEDULED_AT
          description: The type to sort by
        required: false
        description: The type to sort by
        name: sortType
        in: query
      - schema:
          type: string
          enum:
          - asc
          - desc
          default: desc
          description: The direction to sort by
        required: false
        description: The direction to sort by
        name: sortDirection
        in: query
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  nextCursor:
                    type:
                    - string
                    - 'null'
                  totalCount:
                    type: integer
                    default: 100
                    example: 20
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                          description: The execution ID.
                        status:
                          type: string
                          enum:
