                                  - UNAUTHENTICATED
                                  - SENSITIVE_DATA
                                  - CRITICAL_FINDING
                                  - PROD_ONLY_MODE
                                  - EXPOSED
                                  - OPEN_SCHEMA
                                  - PRIVATE
