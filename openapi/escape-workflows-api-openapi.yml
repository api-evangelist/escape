      summary: Delete workflow
      operationId: deleteWorkflow
      description: Delete a workflow.
      parameters:
      - schema:
          type: string
          format: uuid
          description: The workflow ID
          example: 00000000-0000-0000-0000-000000000000
        required: true
        description: The workflow ID
        name: id
        in: path
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                    default: 00000000-0000-0000-0000-000000000000
                    description: The workflow ID.
                  name:
