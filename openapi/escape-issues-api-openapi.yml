  /issues/{issueId}/ai-remediation:
    post:
      tags:
      - Issues
      summary: Generate AI remediation for an issue
      operationId: generateIssueAiRemediation
      description: 'Trigger the asynchronous generation of AI remediation for an issue. Generation only schedules a job: read the result back with GET /v3/issues/{issueId}, on `remediation` for the full issue-panel remediation or on `aiRemediationSummary` for the short overview summary. Generating the full remediation clears the previous remediation and its feedback immediately. Generating the summary replaces the previous summary, and resets its rating, only once the generation job succeeds. Identical requests repeated within a short window are ignored and return `generated: false`.'
      parameters:
      - schema:
          type: string
          format: uuid
          description: The issue ID
          example: 00000000-0000-0000-0000-000000000000
        required: true
        description: The issue ID
        name: issueId
        in: path
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                kind:
                  type: string
                  enum:
                  - remediation
                  - summary
                  default: remediation
                  description: 'Which AI remediation artefact to act on: `remediation` for the full issue-panel remediation, `summary` for the short overview summary.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  kind:
                    type: string
                    enum:
                    - remediation
                    - summary
                    description: The AI remediation that was requested
                  generated:
                    type: boolean
                    description: Whether the generation request was accepted. False when an identical request is already in flight.
                  cleared:
                    type: boolean
                    description: Whether this trigger synchronously cleared an existing full remediation (and its feedback). Always false for the `summary` kind, which is replaced asynchronously once the generation job succeeds.
                required:
                - kind
                - generated
                - cleared
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    enum:
                    - Bad Request
                  details:
                    type: string
                required:
                - message
                - details
                title: BadRequest
                description: Returned when the request payload fails validation
        '404':
          description: Not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    enum:
                    - Not found
                required:
                - message
                title: NotFound
                description: Returned when the requested resource does not exist
