                    enum:
                    - FALSE_POSITIVE
                    - IGNORED
                    - MANUAL_REVIEW
                    - OPEN
                    - RESOLVED
                    description: 'Deprecated: pass an object { value, reason } instead'
                    deprecated: true
                  description: The issue status
                severity:
                  anyOf:
                  - type: object
                    properties:
                      value:
                        type:
                        - string
                        - 'null'
                        enum:
                        - CRITICAL
                        - HIGH
                        - INFO
                        - LOW
                        - MEDIUM
                        - null
                        description: The severity to set. Pass null to reset to the scanner default.
                      reason:
                        type:
                        - string
                        - 'null'
                        minLength: 1
                        maxLength: 512
                        description: Reason for the change (required if your organization enforces it)
                    required:
                    - value
                  - type: string
                    enum:
                    - CRITICAL
                    - HIGH
                    - INFO
                    - LOW
                    - MEDIUM
                    description: 'Deprecated: pass an object { value, reason } instead'
                    deprecated: true
                  - type: 'null'
                    description: 'Deprecated: pass an object { value, reason } instead'
                    deprecated: true
                  - type: 'null'
                  description: The issue severity
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ids:
                    type: array
                    items:
                      type: string
                    description: The IDs of the updated issues
                required:
                - ids
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    enum:
