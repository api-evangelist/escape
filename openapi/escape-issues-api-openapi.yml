                        - INFORMATION_DISCLOSURE
                        - INJECTION
                        - PROTOCOL
                        - REQUEST_FORGERY
                        - RESOURCE_LIMITATION
                        - SCHEMA
                        - SENSITIVE_DATA
                      description: Filter by issue categories
                    assetTypes:
                      type: array
                      items:
                        type: string
                        enum:
                        - APK
                        - AWS_LAMBDA
                        - BITBUCKET_REPOSITORY
                        - BURPSUITE_EXPORT
                        - CODE_PROJECT
                        - DNS
                        - GITHUB_REPOSITORY
                        - GITLAB_REPOSITORY
                        - GRAPHQL
                        - GRAPHQL_SCHEMA
