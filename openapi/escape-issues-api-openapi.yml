                        - ASM_GRPC
                        - ASM_HAR_EXPORT
                        - ASM_INSOMNIA
                        - ASM_IPV4
                        - ASM_IPV4_RANGE
                        - ASM_IPV6
                        - ASM_MCP
                        - ASM_OPENAPI
                        - ASM_PACKAGE
                        - ASM_POSTMAN_COLLECTION
                        - ASM_POSTMAN_ENVIRONMENT
                        - ASM_REST
                        - ASM_SOAP
                        - ASM_SOFTWARE
                        - ASM_WEBAPP
                        - ASM_WEBSOCKET
                        - ASM_WP_JSON
                        - AUTOMATED_PENTEST
