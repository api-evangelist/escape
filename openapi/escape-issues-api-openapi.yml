openapi: 3.2.0
info:
  version: 3.0.0
  title: Escape Public Issues API
  description: 'This API enables you to operate Escape programmatically.


    All requests must be authenticated with a valid API key, provided in the `X-ESCAPE-API-KEY` header.

    For example: `X-ESCAPE-API-KEY: YOUR_API_KEY`.


    You can find your API key in the Escape dashboard.'
servers:
- url: https://public.escape.tech/v3
security:
- apiKey: []
tags:
- name: Issues
  description: 'Manage issues.


    Identify, prioritize, and remediate the security issues and sensitive data exposures uncovered during ASM and DAST scanning


    See our documentation for more details.'
paths:
  /issues:
    get:
      tags:
      - Issues
      summary: List issues
      operationId: listIssues
      description: List and search issues of the organization.
      parameters:
      - schema:
          type: string
          description: The cursor to start the pagination from. Returned by the previous page response. If not provided, the first page will be returned.
          example: R1BDOlM6NTEwMzk4NTYtNGIyOS00NTlkLTg0ZDYtMWJhYjM0NWMzZjU5
        required: false
        description: The cursor to start the pagination from. Returned by the previous page response. If not provided, the first page will be returned.
        name: cursor
        in: query
      - schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
          description: The number of items to return per page
          example: 50
        required: false
        description: The number of items to return per page
        name: size
        in: query
      - schema:
          type: string
          enum:
          - ASSET
          - LAST_SEEN
          - SEVERITY
          description: The type to sort by
        required: false
        description: The type to sort by
        name: sortType
        in: query
      - schema:
          type: string
          enum:
          - asc
          - desc
          default: asc
          description: The direction to sort by
        required: false
        description: The direction to sort by
        name: sortDirection
        in: query
      - schema:
          anyOf:
          - type: string
          - type: array
            items:
              type: string
          description: Filter by application IDs
          example: 00000000-0000-0000-0000-000000000000,00000000-0000-0000-0000-000000000001
        required: false
        description: Filter by application IDs
        name: profileIds
        in: query
      - schema:
          anyOf:
          - type: string
          - type: array
            items:
              type: string
          description: Filter by asset IDs
          example: 00000000-0000-0000-0000-000000000000,00000000-0000-0000-0000-000000000001
        required: false
        description: Filter by asset IDs
        name: assetIds
        in: query
      - schema:
          anyOf:
          - type: string
          - type: array
            items:
              type: string
          description: Filter by domain
          example: example.com,example.org
        required: false
        description: Filter by domain
        name: domains
        in: query
      - schema:
          anyOf:
          - type: string
          - type: array
            items:
              type: string
          description: Filter by specific issue IDs
          example: 00000000-0000-0000-0000-000000000000,00000000-0000-0000-0000-000000000001
        required: false
        description: Filter by specific issue IDs
        name: ids
        in: query
      - schema:
          anyOf:
          - type: string
          - type: array
            items:
              type: string
          description: Filter by issue full name (the display name including risk characteristics, e.g. 'SQL injection found on external-facing asset')
          example: SQL injection found,SQL injection found on external-facing asset
        required: false
        description: Filter by issue full name (the display name including risk characteristics, e.g. 'SQL injection found on external-facing asset')
        name: names
        in: query
      - schema:
          anyOf:
          - type: string
          - type: array
            items:
              type: string
          description: Filter by scan IDs
          example: 00000000-0000-0000-0000-000000000000,00000000-0000-0000-0000-000000000001
        required: false
        description: Filter by scan IDs
        name: scanIds
        in: query
      - schema:
          anyOf:
          - type: string
          - type: array
            items:
              type: string
          description: Filter by tag IDs
          example: 00000000-0000-0000-0000-000000000000,00000000-0000-0000-0000-000000000001
        required: false
        description: Filter by tag IDs
        name: tagIds
        in: query
      - schema:
          anyOf:
          - type: string
          - type: array
            items:
              type: string
          description: Filter by project IDs
          example: 00000000-0000-0000-0000-000000000000,00000000-0000-0000-0000-000000000001
        required: false
        description: Filter by project IDs
        name: projectIds
        in: query
      - schema:
          anyOf:
          - type: string
          - type: array
            items:
              type: string
          description: Filter by target IDs
          example: 00000000-0000-0000-0000-000000000000,00000000-0000-0000-0000-000000000001
        required: false
        description: Filter by target IDs
        name: targetIds
        in: query
      - schema:
          anyOf:
          - type: string
          - type: array
            items:
              type: string
          description: Filter by security test UIDs
          example: ISSUE_SQL_INJECTION,ISSUE_CVE_2021_44228
        required: false
        description: Filter by security test UIDs
        name: securityTestUids
        in: query
      - schema:
          anyOf:
          - type: string
          - type: array
            items:
              type: string
          description: Exclude these issue IDs
          example: 00000000-0000-0000-0000-000000000000,00000000-0000-0000-0000-000000000001
        required: false
        description: Exclude these issue IDs
        name: blacklistedIds
        in: query
      - schema:
          anyOf:
          - type: string
          - type: array
            items:
              type: string
          description: Exclude issues by their raw name (e.g. 'SQL injection')
          example: SQL injection,Cross-Site Scripting
        required: false
        description: Exclude issues by their raw name (e.g. 'SQL injection')
        name: blacklistedNames
        in: query
      - schema:
          type: string
          description: Search term to filter issues by name or description
          example: issue1
        required: false
        description: Search term to filter issues by name or description
        name: search
        in: query
      - schema:
          type: string
          enum:
          - 'true'
          - 'false'
          example: 'true'
          description: Filter by issues with Jira tickets
        required: false
        description: Filter by issues with Jira tickets
        name: jiraTicket
        in: query
      - schema:
          type: string
          enum:
          - 'true'
          description: 'Filter by issues whose assets have no tags. Only `true` is supported: the API cannot express "assets that have tags", so `false` is rejected instead of silently matching every issue.'
          example: 'true'
        required: false
        description: 'Filter by issues whose assets have no tags. Only `true` is supported: the API cannot express "assets that have tags", so `false` is rejected instead of silently matching every issue.'
        name: noTags
        in: query
      - schema:
          type: string
          enum:
          - 'true'
          - 'false'
          example: 'true'
          description: Filter by AI false positive classification
        required: false
        description: Filter by AI false positive classification
        name: aiFalsePositive
        in: query
      - schema:
          type: string
          enum:
          - 'true'
          - 'false'
          example: 'true'
          description: Filter by agentic (AI pentest) issues
        required: false
        description: Filter by agentic (AI pentest) issues
        name: agentic
        in: query
      - schema:
          type: array
          items:
            type: string
            enum:
            - CRITICAL_FINDING
            - EXPOSED
            - OPEN_SCHEMA
            - PRIVATE
            - PROD_ONLY_MODE
            - SENSITIVE_DATA
            - UNAUTHENTICATED
          description: Filter by risk types
        required: false
        description: Filter by risk types
        name: risks
        in: query
      - schema:
          type: array
          items:
            type: string
            enum:
            - API_SERVICE
            - CDN
            - CLOUD_COMPONENT
            - CLOUD_HOSTING
            - CODE_PROJECT
            - CSPM
            - DEV_TOOLS
            - FRONTEND
            - HOST
            - MOBILE_APP
            - NETWORK
            - REPOSITORY
            - SCHEMA
            - SOURCE_CODE_MANAGEMENT
            - TECHNOLOGY
          description: Filter by asset classes
        required: false
        description: Filter by asset classes
        name: assetClasses
        in: query
      - schema:
          type: array
          items:
            type: string
            enum:
            - ACCESS_CONTROL
            - CONFIGURATION
            - CUSTOM
            - INFORMATION_DISCLOSURE
            - INJECTION
            - PROTOCOL
            - REQUEST_FORGERY
            - RESOURCE_LIMITATION
            - SCHEMA
            - SENSITIVE_DATA
          description: Filter by issue categories
        required: false
        description: Filter by issue categories
        name: categories
        in: query
      - schema:
          type: array
          items:
            type: string
            enum:
            - APK
            - AWS_LAMBDA
            - BITBUCKET_REPOSITORY
            - BURPSUITE_EXPORT
            - CODE_PROJECT
            - DNS
            - GITHUB_REPOSITORY
            - GITLAB_REPOSITORY
            - GRAPHQL
            - GRAPHQL_SCHEMA
            - GRPC
            - HAR_EXPORT
            - INSOMNIA
            - IPV4
            - IPV4_RANGE
            - IPV6
            - MCP
            - OPENAPI
            - PACKAGE
            - POSTMAN_COLLECTION
            - POSTMAN_ENVIRONMENT
            - REST
            - SOAP
            - SOFTWARE
            - WEBAPP
            - WEBSOCKET
            - WP_JSON
          description: Filter by asset types
        required: false
        description: Filter by asset types
        name: assetTypes
        in: query
      - schema:
          type: array
          items:
            type: string
            enum:
            - DEPRECATED
            - FALSE_POSITIVE
            - MONITORED
            - OUT_OF_SCOPE
            - THIRD_PARTY
          description: Filter by asset statuses
        required: false
        description: Filter by asset statuses
        name: assetStatuses
        in: query
      - schema:
          type: array
          items:
            type: string
            enum:
            - ASM_APK
            - ASM_AWS_LAMBDA
            - ASM_BITBUCKET_REPOSITORY
            - ASM_BURPSUITE_EXPORT
            - ASM_CODE_PROJECT
            - ASM_DNS
            - ASM_GITHUB_REPOSITORY
            - ASM_GITLAB_REPOSITORY
            - ASM_GRAPHQL
            - ASM_GRAPHQL_SCHEMA
            - ASM_GRPC
            - ASM_HAR_EXPORT
            - ASM_INSOMNIA
            - ASM_IPV4
            - ASM_IPV4_RANGE
            - ASM_IPV6
            - ASM_MCP
            - ASM_OPENAPI
            - ASM_PACKAGE
            - ASM_POSTMAN_COLLECTION
            - ASM_POSTMAN_ENVIRONMENT
            - ASM_REST
            - ASM_SOAP
            - ASM_SOFTWARE
            - ASM_WEBAPP
            - ASM_WEBSOCKET
            - ASM_WP_JSON
            - AUTOMATED_PENTEST
            - BLST_GRAPHQL
            - BLST_REST
            - CONTINUOUS_PENTEST
            - EXTERNAL_NETWORK_PENTEST
            - FRONTEND_DAST
            - MOBILE_APP_PENTEST
            - RETEST
            - AUTOMATED_PENTEST_WEBAPP
            - AUTOMATED_PENTEST_REST
            - AUTOMATED_PENTEST_GRAPHQL
          description: Filter by scanner kinds
        required: false
        description: Filter by scanner kinds
        name: scannerKinds
        in: query
      - schema:
          type: array
          items:
            type: string
            enum:
            - CRITICAL
            - HIGH
            - INFO
            - LOW
            - MEDIUM
          description: Filter by issue severities
        required: false
        description: Filter by issue severities
        name: severities
        in: query
      - schema:
          type: array
          items:
            type: string
            enum:
            - FALSE_POSITIVE
            - IGNORED
            - MANUAL_REVIEW
            - OPEN
            - RESOLVED
          description: Filter by issue status
        required: false
        description: Filter by issue status
        name: status
        in: query
      - schema:
          type: string
          description: Advanced filter as a DNF expression (URL-encoded JSON object)
        required: false
        description: Advanced filter as a DNF expression (URL-encoded JSON object)
        name: dnf
        in: query
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  nextCursor:
                    type:
                    - string
                    - 'null'
                  totalCount:
                    type: integer
                    default: 100
                    example: 20
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                          description: The id of the issue
                        name:
                          type: string
                          description: The name of the issue
                        fullName:
                          type: string
                          description: The full name of the issue
                        category:
                          type: string
                          enum:
                          - ACCESS_CONTROL
                          - CONFIGURATION
                          - CUSTOM
                          - INFORMATION_DISCLOSURE
                          - INJECTION
                          - PROTOCOL
                          - REQUEST_FORGERY
                          - RESOURCE_LIMITATION
                          - SCHEMA
                          - SENSITIVE_DATA
                          description: The category of the issue
                        severity:
                          type: string
                          enum:
                          - CRITICAL
                          - HIGH
                          - INFO
                          - LOW
                          - MEDIUM
                          description: The severity level of the issue
                        manualSeverity:
                          type: boolean
                          description: Whether the severity has been manually overridden
                        status:
                          type: string
                          enum:
                          - FALSE_POSITIVE
                          - IGNORED
                          - MANUAL_REVIEW
                          - OPEN
                          - RESOLVED
                          description: The current status of the issue
                        context:
                          type: string
                          description: The context of the issue
                        risks:
                          type: array
                          items:
                            type: string
                            enum:
                            - CRITICAL_FINDING
                            - EXPOSED
                            - OPEN_SCHEMA
                            - PRIVATE
                            - PROD_ONLY_MODE
                            - SENSITIVE_DATA
                            - UNAUTHENTICATED
                          description: Array of risk types associated with the issue
                        alertUid:
                          type: string
                          description: Unique identifier for the alert
                        createdAt:
                          type: string
                          description: When the issue was first created
                        asset:
                          type: object
                          properties:
                            id:
                              type: string
                              format: uuid
                              description: The id of the asset
                            class:
                              type: string
                              enum:
                              - API_SERVICE
                              - CDN
                              - CLOUD_COMPONENT
                              - CLOUD_HOSTING
                              - CODE_PROJECT
                              - CSPM
                              - DEV_TOOLS
                              - FRONTEND
                              - HOST
                              - MOBILE_APP
                              - NETWORK
                              - REPOSITORY
                              - SCHEMA
                              - SOURCE_CODE_MANAGEMENT
                              - TECHNOLOGY
                              description: The class of the asset
                            type:
                              type: string
                              enum:
                              - APK
                              - AWS_LAMBDA
                              - BITBUCKET_REPOSITORY
                              - BURPSUITE_EXPORT
                              - CODE_PROJECT
                              - DNS
                              - GITHUB_REPOSITORY
                              - GITLAB_REPOSITORY
                              - GRAPHQL
                              - GRAPHQL_SCHEMA
                              - GRPC
                              - HAR_EXPORT
                              - INSOMNIA
                              - IPV4
                              - IPV4_RANGE
                              - IPV6
                              - MCP
                              - OPENAPI
                              - PACKAGE
                              - POSTMAN_COLLECTION
                              - POSTMAN_ENVIRONMENT
                              - REST
                              - SOAP
                              - SOFTWARE
                              - WEBAPP
                              - WEBSOCKET
                              - WP_JSON
                              description: The type of the asset
                            name:
                              type: string
                              description: The name of the asset
                            externalUrl:
                              type:
                              - string
                              - 'null'
                              description: The external url of the asset
                            faviconUrl:
                              type:
                              - string
                              - 'null'
                              description: The favicon url of the asset
                            createdAt:
                              type: string
                              description: The date and time the asset was created
                            lastSeenAt:
                              type: string
                              description: The date and time the asset was last seen
                            scheduledForDeletionAt:
                              type:
                              - string
                              - 'null'
                              description: The date and time the asset is scheduled for deletion
                            status:
                              type: string
                              enum:
                              - DEPRECATED
                              - FALSE_POSITIVE
                              - MONITORED
                              - OUT_OF_SCOPE
                              - THIRD_PARTY
                              description: The status of the asset
                            tags:
                              type: array
                              items:
                                type: object
                                properties:
                                  id:
                                    type: string
                                    format: uuid
                                    description: The id of the tag
                                  name:
                                    type: string
                                    description: The name of the tag
                                  color:
                                    type: string
                                    description: The color of the tag
                                required:
                                - id
                                - name
                                - color
                                title: Tag
                                description: Information about a tag
                              description: The tags of the asset
                            risks:
                              type: array
                              items:
                                type: string
                                enum:
                                - CRITICAL_FINDING
                                - EXPOSED
                                - OPEN_SCHEMA
                                - PRIVATE
                                - PROD_ONLY_MODE
                                - SENSITIVE_DATA
                                - UNAUTHENTICATED
                              description: The risks of the asset
                            projectIds:
                              type: array
                              items:
                                type: string
                                format: uuid
                              description: IDs of the projects this asset is assigned to
                            owners:
                              type: array
                              items:
                                type: string
                                format: email
                              description: Email addresses of the owners of this asset.
                            service:
                              type:
                              - object
                              - 'null'
                              properties:
                                url:
                                  type: string
                                  description: The url of the asset service
                                type:
                                  type: string
                                  enum:
                                  - GRAPHQL
                                  - GRPC
                                  - MCP
                                  - REST
                                  - SOAP
                                  - WEBSOCKET
                                  description: The type of the asset service
                              required:
                              - url
                              - type
                              title: AssetServiceSummarized
                              description: The service of the asset
                            frontend:
                              type:
                              - object
                              - 'null'
                              properties:
                                url:
                                  type: string
                                  description: The url of the asset frontend
                                type:
                                  type: string
                                  enum:
                                  - WEBAPP
                                  description: The type of the asset frontend
                              required:
                              - url
                              - type
                              title: AssetFrontendSummarized
                              description: The frontend of the asset
                            host:
                              type:
                              - object
                              - 'null'
                              properties:
                                address:
                                  type: string
                                  description: The address of the asset host
                                type:
                                  type: string
                                  enum:
                                  - DNS
                                  - IPV4
                                  - IPV6
                                  description: The type of the asset host
                              required:
                              - address
                              - type
                              title: AssetHostSummarized
                              description: The host of the asset
                            technology:
                              type:
                              - object
                              - 'null'
                              properties:
                                type:
                                  type: string
                                  enum:
                                  - PACKAGE
                                  - SOFTWARE
                                  description: Whether this is a PACKAGE or SOFTWARE asset
                                technologyKey:
                                  type: string
                                  description: Versionless technology identifier (e.g. vendor/product or ecosystem/name)
                                version:
                                  type:
                                  - string
                                  - 'null'
                                  description: Detected version, if known
                                cpe:
                                  type:
                                  - string
                                  - 'null'
                                  description: Common Platform Enumeration identifier, if known
                              required:
                              - type
                              - technologyKey
                              - version
                              - cpe
                              title: AssetTechnologySummarized
                              description: Technology metadata for PACKAGE and SOFTWARE assets
                            mobileApp:
                              type:
                              - object
                              - 'null'
                              properties:
                                type:
                                  type: string
                                  enum:
                                  - APK
                                  description: The type of the mobile app
                                filename:
                                  type:
                                  - string
                                  - 'null'
                                  description: Original uploaded filename
                                bundleId:
                                  type:
                                  - string
                                  - 'null'
                                  description: Android package name, if known
                              required:
                              - type
                              - filename
                              - bundleId
                              title: AssetMobileAppSummarized
                              description: Mobile app metadata for APK assets
                            links:
                              type: object
                              properties:
                                assetOverview:
                                  type: string
                                  description: The url to view the asset overview in the platform
                              required:
                              - assetOverview
                              description: The links of the asset
                          required:
                          - id
                          - class
                          - type
                          - name
                          - externalUrl
                          - faviconUrl
                          - createdAt
                          - lastSeenAt
                          - scheduledForDeletionAt
                          - status
                          - tags
                          - risks
                          - projectIds
                          - service
                          - frontend
                          - host
                          - technology
                          - mobileApp
                          - links
                          title: AssetSummarized
                          description: The asset of the issue
                        lastSeenScanId:
                          type:
                          - string
                          - 'null'
                          description: ID of the last scan where this issue was seen
                        lastSeenScan:
                          type:
                          - object
                          - 'null'
                          properties:
                            id:
                              type: string
                              format: uuid
                              description: The id of the scan
                            profileId:
                              type:
                              - string
                              - 'null'
                              format: uuid
                              description: The id of the profile that ran the scan
                            assetId:
                              type:
                              - string
                              - 'null'
                              format: uuid
                              description: The id of the asset that was scanned, if any
                            status:
                              type: string
                              description: The status of the scan
                            createdAt:
                              type: string
                              description: The date and time the scan was created
                            finishedAt:
                              type:
                              - string
                              - 'null'
                              description: The date and time the scan was finished
                            score:
                              type:
                              - number
                              - 'null'
                              description: The score of the scan
                            coverage:
                              type:
                              - number
                              - 'null'
                              description: Aggregate API coverage ratio for this scan (0–1), when the scan has finished with coverage data
                            duration:
                              type: number
                              description: The duration of the scan
                            progressRatio:
                              type: number
                              description: The progress ratio of the scan
                            initiator:
                              type: string
                              description: The initiator of the scan
                            kind:
                              type: string
                              description: The kind of the scan
                            commitHash:
                              type:
                              - string
                              - 'null'
                              description: The commit hash of the scan
                            commitBranch:
                              type:
                              - string
                              - 'null'
                              description: The commit branch of the scan
                            links:
                              type: object
                              properties:
                                scanIssues:
                                  type: string
                                  description: The url to view the scan issues in the platform
                              required:
                              - scanIssues
                              description: The links of the scan
                          required:
                          - id
                          - profileId
                          - assetId
                          - status
                          - createdAt
                          - finishedAt
                          - score
                          - coverage
                          - duration
                          - progressRatio
                          - initiator
                          - kind
                          - commitHash
                          - commitBranch
                          - links
                          title: ScanSummarized
                          description: The last scan in which this issue was observed
                        firstSeenScanId:
                          type:
                          - string
                          - 'null'
                          description: ID of the first scan where this issue was seen
                        customRuleId:
                          type:
                          - string
                          - 'null'
                          description: ID of the custom rule if this is a custom issue
                        links:
                          type: object
                          properties:
                            issueOverview:
                              type: string
                              description: URL to view the issue overview in the platform
                          required:
                          - issueOverview
                      required:
                      - id
                      - name
                      - fullName
                      - category
                      - severity
                      - manualSeverity
                      - status
                      - context
                      - risks
                      - alertUid
                      - createdAt
                      - asset
                      - lastSeenScanId
                      - lastSeenScan
                      - firstSeenScanId
                      - customRuleId
                      - links
                      title: IssueSummarized
                      description: Summarized information about an issue
                required:
                - nextCursor
                - data
        '400':
          description: Pagination error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    enum:
                    - Invalid cursor
                    - Branch filters page limit reached
                  details:
                    type: string
                required:
                - message
                - details
                title: PaginationError
                description: Returned when an invalid pagination cursor is supplied or when the branch filters page limit is reached
  /issues/funnel:
    get:
      tags:
      - Issues
      summary: Get issue funnel
