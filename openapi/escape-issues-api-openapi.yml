                        type: string
                        enum:
                        - CRITICAL_FINDING
                        - EXPOSED
                        - OPEN_SCHEMA
                        - PRIVATE
                        - PROD_ONLY_MODE
                        - SENSITIVE_DATA
                        - UNAUTHENTICATED
                      description: Filter by risk types
                    assetClasses:
                      type: array
                      items:
                        type: string
                        enum:
                        - API_SERVICE
                        - CDN
                        - CLOUD_COMPONENT
                        - CLOUD_HOSTING
                        - CODE_PROJECT
                        - CSPM
                        - DEV_TOOLS
                        - FRONTEND
                        - HOST
                        - MOBILE_APP
                        - NETWORK
                        - REPOSITORY
                        - SCHEMA
