  /issues/bulk-update:
    post:
      tags:
      - Issues
      summary: Bulk update issues
      operationId: bulkUpdateIssues
      description: 'Update the status and/or severity of multiple issues matching a filter predicate. For example, mark all LOW severity issues on a given asset as IGNORED, or reset severities to scanner values. A non-empty `where` or `all: true` is required. Set `dryRun` to preview the matching issue IDs without changing anything. Requests matching more than 10,000 issues are rejected: narrow the filter.'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  anyOf:
                  - type: object
                    properties:
                      value:
                        type: string
                        enum:
                        - FALSE_POSITIVE
                        - IGNORED
                        - MANUAL_REVIEW
                        - OPEN
                        - RESOLVED
                        description: The status to set
                      reason:
                        type:
                        - string
                        - 'null'
                        minLength: 1
                        maxLength: 512
                        description: Reason for the change (required if your organization enforces it)
                    required:
                    - value
                  - type: string
                    enum:
                    - FALSE_POSITIVE
                    - IGNORED
                    - MANUAL_REVIEW
                    - OPEN
                    - RESOLVED
                    description: 'Deprecated: pass an object { value, reason } instead'
                    deprecated: true
                  description: The new status to apply
                severity:
                  anyOf:
                  - type: object
                    properties:
                      value:
                        type:
                        - string
                        - 'null'
                        enum:
                        - CRITICAL
                        - HIGH
                        - INFO
                        - LOW
                        - MEDIUM
                        - null
                        description: The severity to set. Pass null to reset to the scanner default.
                      reason:
                        type:
                        - string
                        - 'null'
                        minLength: 1
                        maxLength: 512
                        description: Reason for the change (required if your organization enforces it)
                    required:
                    - value
                  - type: string
                    enum:
                    - CRITICAL
                    - HIGH
                    - INFO
                    - LOW
                    - MEDIUM
                    description: 'Deprecated: pass an object { value, reason } instead'
                    deprecated: true
                  - type: 'null'
                    description: 'Deprecated: pass an object { value, reason } instead'
                    deprecated: true
                  - type: 'null'
                  description: The new severity to apply. Pass null to reset to the scanner severity.
                where:
                  type: object
                  properties:
                    ids:
                      type: array
                      items:
                        type: string
                      description: Filter by specific issue IDs
                    blacklistedIds:
                      type: array
                      items:
                        type: string
                        format: uuid
                      description: Exclude these issue IDs
                    blacklistedNames:
                      type: array
                      items:
                        type: string
                      description: Exclude issues by their raw name (e.g. 'SQL injection')
                    projectIds:
                      type: array
                      items:
                        type: string
                        format: uuid
                      description: Filter by project IDs
                    profileIds:
                      type: array
                      items:
                        type: string
                      description: Filter by profile IDs
                    assetIds:
                      type: array
                      items:
                        type: string
                      description: Filter by asset IDs
                    targetIds:
                      type: array
                      items:
                        type: string
                        format: uuid
                      description: Filter by target IDs
                    scanIds:
                      type: array
                      items:
                        type: string
                        format: uuid
                      description: Filter by scan IDs
                    tagIds:
                      type: array
                      items:
                        type: string
                      description: Filter by tag IDs
                    securityTestUids:
                      type: array
                      items:
                        type: string
                      description: Filter by security test UIDs
                    domains:
                      type: array
                      items:
                        type: string
                      description: Filter by domain
                    names:
                      type: array
                      items:
                        type: string
                      description: Filter by issue full name (the display name including risk characteristics, e.g. 'SQL injection found on external-facing asset')
                    search:
                      type: string
                      description: Search term to filter issues by name or description
                    jiraTicket:
                      type: boolean
                      description: Filter by issues with Jira tickets
                    noTags:
                      type: boolean
                      enum:
                      - true
                      description: 'Filter by issues whose assets have no tags. Only `true` is supported: the API cannot express "assets that have tags", so `false` is rejected instead of silently matching every issue.'
                    aiFalsePositive:
                      type: boolean
                      description: Filter by AI false positive classification
